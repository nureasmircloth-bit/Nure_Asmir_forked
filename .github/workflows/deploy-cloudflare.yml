name: Deploy to Cloudflare Workers

# Four Workers come out of this repo, each built on its own (scripts/build-target.mjs):
#   nure-asmir            - the storefront                       (nureasmir.com, www)         database: nure-asmir-prod
#   nure-asmir-admin      - the owner's admin panel              (admin.nureasmir.com)        database: nure-asmir-prod
#   nure-asmir-developer  - the developer console                (developer.nureasmir.com)    database: nure-asmir-prod
#   nure-asmir-training   - the training lab, in practice mode   (training.nureasmir.com)      database: nure-asmir-training (its own)
# Database migrations run first, so a deploy never ships code that needs a column that is not there.
#
# MANUAL ONLY until the move from Vercel is finished: run it from the Actions tab. To make it the live deploy, add
#   push:
#     branches: [main]
# under `on:` once nureasmir.com points at Cloudflare.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Deploy only one Worker (leave as all for all four)"
        type: choice
        default: all
        options: [all, store, admin, developer, training]

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The build reads the shop from a throw-away local SQLite file (same migrations); the live databases are only touched by wrangler below.
      LOCAL_DB_PATH: ${{ github.workspace }}/.local-db/build.sqlite
      # NEXT_PUBLIC_* values are inlined into the browser bundles at build time.
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_STORE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_ADMIN_URL: ${{ secrets.NEXT_PUBLIC_ADMIN_URL }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_GOOGLE_MERCHANT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MERCHANT_ID }}
      NEXT_PUBLIC_CDN_URL: ${{ secrets.NEXT_PUBLIC_CDN_URL }}
      NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
      NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
      NEXT_PUBLIC_ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
      NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
      ONLY: ${{ inputs.only || 'all' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Check the Cloudflare secrets
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!v:-}" ]; then echo "::error::$v is not set"; exit 1; fi
          done

      - name: Local database for the build
        run: node scripts/local-db.mjs "$LOCAL_DB_PATH" --reset

      # --- databases first ---------------------------------------------------------------------------------------------------------
      - name: Migrate the shop database (D1)
        if: ${{ env.ONLY != 'training' }}
        run: npx wrangler d1 migrations apply DB --remote -c wrangler.jsonc

      - name: Migrate the training database (D1)
        if: ${{ env.ONLY == 'all' || env.ONLY == 'training' }}
        run: npx wrangler d1 migrations apply DB --remote -c wrangler.training.jsonc

      # The ISR page cache and the second picture store live in Cloudflare R2; the buckets are created once (Asia-Pacific for the new ones; see wrangler.jsonc). To create one by hand: wrangler r2 bucket create <name> --location apac.
      - name: Prepare the R2 buckets
        run: |
          for bucket in nure-asmir-cache-apac nure-asmir-media-apac nure-asmir-media-r2 nure-asmir-training-media; do
            npx wrangler r2 bucket info "$bucket" >/dev/null 2>&1 || npx wrangler r2 bucket create "$bucket" --location apac
          done

      # --- storefront ------------------------------------------------------------------------------------------------------------------
      - name: Build and deploy the storefront
        if: ${{ env.ONLY == 'all' || env.ONLY == 'store' }}
        run: |
          npm run cf:build:store
          npx wrangler deploy -c wrangler.jsonc --var BUILD_ID:${{ github.sha }}

      # Every build has freshly hashed chunk names, so pages cached by the previous build must go (only incremental-cache/ in that bucket).
      - name: Purge stale ISR page cache
        if: ${{ env.ONLY == 'all' || env.ONLY == 'store' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: nure-asmir-cache-apac
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -n "${R2_ACCESS_KEY_ID:-}" ]; then npx tsx scripts/purge-isr-cache.ts; else echo "::warning::R2_* secrets are not set - skipping the ISR cache purge."; fi

      # --- admin, developer, training --------------------------------------------------------------------------------------------------
      - name: Build and deploy the admin panel
        if: ${{ env.ONLY == 'all' || env.ONLY == 'admin' }}
        run: |
          npm run cf:build:admin
          npx wrangler deploy -c wrangler.admin.jsonc

      - name: Build and deploy the developer console
        if: ${{ env.ONLY == 'all' || env.ONLY == 'developer' }}
        run: |
          npm run cf:build:developer
          npx wrangler deploy -c wrangler.developer.jsonc

      - name: Build and deploy the training lab
        if: ${{ env.ONLY == 'all' || env.ONLY == 'training' }}
        run: |
          npm run cf:build:training
          npx wrangler deploy -c wrangler.training.jsonc

      # --- runtime secrets ---------------------------------------------------------------------------------------------------------------
      # Each value arrives through `env:` and is piped with printf '%s' - never put into the script text. The store, admin and developer
      # Workers get the shop's keys; the training lab gets only what it needs (no email, WhatsApp, TCS, push, search or AI keys).
      - name: Sync Worker secrets
        env:
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_API_KEY_2: ${{ secrets.RESEND_API_KEY_2 }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          WHATSAPP_DEFAULT_NUMBER: ${{ secrets.WHATSAPP_DEFAULT_NUMBER }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CSP_NONCE: ${{ secrets.CSP_NONCE }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          TCS_USERNAME: ${{ secrets.TCS_USERNAME }}
          TCS_PASSWORD: ${{ secrets.TCS_PASSWORD }}
          TCS_ACCOUNT_NO: ${{ secrets.TCS_ACCOUNT_NO }}
          TCS_COST_CENTER_CODE: ${{ secrets.TCS_COST_CENTER_CODE }}
          TCS_ENV: ${{ secrets.TCS_ENV }}
          TCS_SERVICE_CODE: ${{ secrets.TCS_SERVICE_CODE }}
          TRAINING_PASSWORD: ${{ secrets.TRAINING_PASSWORD }}
        run: |
          set -uo pipefail
          put() {
            local value="${!2:-}"
            if [ -n "$value" ]; then printf '%s' "$value" | npx wrangler secret put "$2" -c "$1" || echo "::warning::could not set $2 on $1"; fi
          }
          SHOP_SECRETS="SESSION_SECRET ADMIN_EMAIL ADMIN_INITIAL_PASSWORD AWS_ENDPOINT_URL_S3 AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION ALGOLIA_APP_ID ALGOLIA_ADMIN_KEY FIREBASE_SERVICE_ACCOUNT RESEND_API_KEY RESEND_API_KEY_2 RESEND_FROM_EMAIL RESEND_FROM_NAME BREVO_API_KEY EMAIL_REPLY_TO WHATSAPP_DEFAULT_NUMBER CRON_SECRET GROQ_API_KEY GROQ_API_KEY_2 GROQ_API_KEY_3 GEOAPIFY_API_KEY TURNSTILE_SECRET_KEY CSP_NONCE WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_APP_SECRET WHATSAPP_TEMPLATE_NAME WHATSAPP_WEBHOOK_VERIFY_TOKEN TCS_USERNAME TCS_PASSWORD TCS_ACCOUNT_NO TCS_COST_CENTER_CODE TCS_ENV TCS_SERVICE_CODE"
          if [ "$ONLY" = all ] || [ "$ONLY" = store ]; then for name in $SHOP_SECRETS; do put wrangler.jsonc "$name"; done; fi
          if [ "$ONLY" = all ] || [ "$ONLY" = admin ]; then for name in $SHOP_SECRETS; do put wrangler.admin.jsonc "$name"; done; fi
          if [ "$ONLY" = all ] || [ "$ONLY" = developer ]; then for name in $SHOP_SECRETS; do put wrangler.developer.jsonc "$name"; done; fi
          if [ "$ONLY" = all ] || [ "$ONLY" = training ]; then
            # no real service key and no Neon Storage credentials: the lab keeps its pictures in its own R2 bucket
            TRAINING_SESSION_SECRET=$(printf '%s' "${SESSION_SECRET}:training" | sha256sum | cut -d' ' -f1)
            for name in TRAINING_PASSWORD CSP_NONCE; do put wrangler.training.jsonc "$name"; done
            printf '%s' "$TRAINING_SESSION_SECRET" | npx wrangler secret put SESSION_SECRET -c wrangler.training.jsonc || echo "::warning::could not set SESSION_SECRET on the training lab"
            for name in AWS_ENDPOINT_URL_S3 AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION DATABASE_URL PRACTICE_DATABASE_URL; do printf "y\n" | npx wrangler secret delete "$name" -c wrangler.training.jsonc >/dev/null 2>&1 || true; done
          fi

      - name: Smoke check
        run: |
          sub=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).result.subdomain||'')}catch{console.log('')}})")
          if [ -z "$sub" ]; then echo "::warning::could not work out the workers.dev subdomain"; exit 0; fi
          check() {
            code="none"
            for i in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "https://$1.$sub.workers.dev$2" || echo none)
              if [ "$code" = 200 ]; then echo "$1$2 answered 200"; return 0; fi
              sleep 6
            done
            echo "::error::$1$2 did not answer 200 (last: $code)"
            return 1
          }
          status=0
          if [ "$ONLY" = all ] || [ "$ONLY" = store ]; then check nure-asmir /api/health || status=1; fi
          if [ "$ONLY" = all ] || [ "$ONLY" = training ]; then check nure-asmir-training /admin/training-login || status=1; fi
          exit $status
