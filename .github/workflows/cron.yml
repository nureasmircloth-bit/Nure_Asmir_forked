name: Reservation expiry cron + DB keep-alive

# Calls /api/cron/expire-reservations on a schedule to release expired inventory holds
# and send reminder notifications. Also pings /api/health to keep Neon DB active.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://nureasmir.com' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Keep the database warm
        continue-on-error: true
        run: curl -sf --retry 2 --retry-delay 2 "$SITE_URL/api/health"

      - name: Call expire-reservations endpoint
        run: |
          curl -sf --retry 2 --retry-delay 2 -X GET "$SITE_URL/api/cron/expire-reservations" \
            -H "Authorization: Bearer $CRON_SECRET"

      # Asks TCS where each booked parcel is. Non-blocking on purpose.
      - name: TCS status sync
        continue-on-error: true
        run: |
          curl -sf --retry 2 --retry-delay 2 -X GET "$SITE_URL/api/cron/courier-sync" \
            -H "Authorization: Bearer $CRON_SECRET"

      # Announces flash sales that just went live and repairs reserved-stock drift. Non-blocking.
      - name: Flash-sale alerts + stock reconciliation
        continue-on-error: true
        run: |
          curl -sf --retry 2 --retry-delay 2 -X GET "$SITE_URL/api/cron/sales" \
            -H "Authorization: Bearer $CRON_SECRET"

      # Daily housekeeping (maintenance). Non-blocking.
      - name: Daily housekeeping
        continue-on-error: true
        run: |
          curl -sf --retry 2 --retry-delay 2 -X GET "$SITE_URL/api/cron/maintenance" \
            -H "Authorization: Bearer $CRON_SECRET"
