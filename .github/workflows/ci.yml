name: CI

# Type-check, lint, unit-test the pure logic and make production builds of BOTH deployables
# (storefront + admin) on every push to development and every pull request, so problems surface
# before they reach main. CodeRabbit reviews the PR itself.
on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Builds run against a throw-away local SQLite file that stands in for Cloudflare D1 (migrated below from ./drizzle), never against
      # a real database: no secret is needed, and a pull request that adds a column can no longer fail the build.
      LOCAL_DB_PATH: ${{ github.workspace }}/.local-db/ci.sqlite
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint app lib scripts e2e db

      - name: Unit tests
        run: npx playwright test --project=unit

      - name: Create the local test database (all migrations)
        run: node scripts/local-db.mjs "$LOCAL_DB_PATH" --reset

      # Production build – verifies Next.js compilation, type-checking and static generation
      - name: Production build – Next.js
        run: npm run build

      # The four deployables are built separately (scripts/build-target.mjs), so a change can never pull admin, developer or training
      # code into the storefront bundle, or the other way round.
      - name: Production build – storefront (Cloudflare)
        run: npm run cf:build:store

      - name: Production build – admin (Cloudflare)
        run: npm run cf:build:admin

      - name: Production build – training lab (Cloudflare)
        run: npm run cf:build:training

      - name: Production build – developer console (Cloudflare)
        run: npm run cf:build:developer
