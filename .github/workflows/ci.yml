name: CI

# Type-check, lint, unit-test the pure logic and make production builds of BOTH deployables
# (storefront + admin) on every push to development and every pull request, so problems surface
# before they reach main. CodeRabbit reviews the PR itself.
on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint app lib scripts e2e

      - name: Unit tests
        run: npx playwright test --project=unit

      # Production build – verifies Next.js compilation, type-checking and static generation
      - name: Production build – Next.js (Vercel)
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run build

      # The training lab is still built for Cloudflare (the admin build), so a pull request must not break it.
      - name: Production build – training lab (Cloudflare admin build)
        if: ${{ env.DATABASE_URL != '' }}
        run: npm run cf:build:admin
