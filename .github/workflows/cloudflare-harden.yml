name: Cloudflare security + CDN host

# Run by hand (Actions → "Cloudflare security + CDN host" → Run workflow). It applies scripts/cloudflare-harden.ts to the
# nureasmir.com zone: TLS and security settings, WAF + rate-limit rules, cache rules, and the cdn.nureasmir.com image host.
# Leave "apply" off first to see what it would do (dry run). The CLOUDFLARE_API_TOKEN secret needs, for the zone: DNS:Edit,
# Zone Settings:Edit, Zone WAF:Edit, Cache Rules:Edit, Config Rules:Edit, Transform Rules:Edit, Origin Rules:Edit.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Really apply the changes (leave off for a dry run)"
        type: boolean
        default: false
      security_only:
        description: "Only the security settings and rules (TLS, bot protection, WAF, rate limit). Leave caching rules and the image host alone."
        type: boolean
        default: true
      zone_name:
        description: "Domain"
        default: nureasmir.com
      cdn_host:
        description: "Image host (blank to skip)"
        default: cdn.nureasmir.com

permissions:
  contents: read

jobs:
  harden:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Find the zone
        id: zone
        run: |
          id=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/zones?name=${{ inputs.zone_name }}" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log((JSON.parse(d).result||[])[0]?.id||''))")
          if [ -z "$id" ]; then echo "::error::The domain ${{ inputs.zone_name }} is not on this Cloudflare account (or the token cannot read zones)."; exit 1; fi
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Apply
        run: |
          args="--zone ${{ steps.zone.outputs.id }}"
          if [ "${{ inputs.security_only }}" = "true" ]; then args="$args --security-only"; fi
          if [ -n "${{ inputs.cdn_host }}" ] && [ "${{ inputs.security_only }}" != "true" ]; then args="$args --cdn-host ${{ inputs.cdn_host }}"; fi
          if [ "${{ inputs.apply }}" = "true" ]; then args="$args --apply"; fi
          npx tsx scripts/cloudflare-harden.ts $args
