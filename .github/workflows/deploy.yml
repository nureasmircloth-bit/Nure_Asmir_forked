name: Deploy to Cloudflare Workers

# Two Workers come out of this repo (see scripts/build-target.mjs):
#   nure-asmir        – the customer storefront (no admin code in the bundle)
#   nure-asmir-admin  – the owner's admin panel
# Database migrations run first so a deploy never ships code that needs a column that is not there.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # NEXT_PUBLIC_* vars are inlined into the client bundles at build time.
      NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_STORE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
      NEXT_PUBLIC_ADMIN_URL: ${{ secrets.NEXT_PUBLIC_ADMIN_URL }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      NEXT_PUBLIC_META_PIXEL_ID: ${{ secrets.NEXT_PUBLIC_META_PIXEL_ID }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_PUBLIC_GOOGLE_MERCHANT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_MERCHANT_ID }}
      NEXT_PUBLIC_CDN_URL: ${{ secrets.NEXT_PUBLIC_CDN_URL }}
      NEXT_PUBLIC_ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
      NEXT_PUBLIC_ALGOLIA_SEARCH_KEY: ${{ secrets.NEXT_PUBLIC_ALGOLIA_SEARCH_KEY }}
      NEXT_PUBLIC_ALGOLIA_INDEX_NAME: ${{ secrets.ALGOLIA_INDEX_NAME }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npx drizzle-kit migrate

      # The ISR page cache needs Cloudflare R2. R2 must be switched on once in the Cloudflare dashboard (R2 →
      # Enable); until then the site is deployed without it (pages render fresh instead of from the cache).
      # The footer's "Admin" link needs the admin Worker's address at build time. Use the NEXT_PUBLIC_ADMIN_URL secret
      # (a custom domain, once there is one); otherwise fall back to the Worker's free workers.dev address.
      - name: Work out the admin address
        run: |
          if [ -z "${NEXT_PUBLIC_ADMIN_URL:-}" ]; then
            sub=$(curl -sf -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(JSON.parse(d).result.subdomain||'')}catch{console.log('')}})")
            if [ -n "$sub" ]; then echo "NEXT_PUBLIC_ADMIN_URL=https://nure-asmir-admin.$sub.workers.dev" >> "$GITHUB_ENV"; else echo "::warning::could not work out the admin address; set the NEXT_PUBLIC_ADMIN_URL secret."; fi
          fi

      - name: Prepare the ISR cache bucket (R2)
        run: |
          if { npx wrangler r2 bucket info nure-asmir-cache >/dev/null 2>&1 || npx wrangler r2 bucket create nure-asmir-cache; } && { npx wrangler r2 bucket info nure-asmir-media-r2 >/dev/null 2>&1 || npx wrangler r2 bucket create nure-asmir-media-r2; }; then
            echo "STORE_CONFIG=wrangler.jsonc" >> "$GITHUB_ENV"
            echo "ADMIN_CONFIG=wrangler.admin.jsonc" >> "$GITHUB_ENV"
          else
            echo "::warning::R2 is not enabled on this Cloudflare account – deploying without the page cache. Enable R2 in the Cloudflare dashboard and re-run this workflow."
            node scripts/without-r2.mjs wrangler.jsonc wrangler.deploy.jsonc
            node scripts/without-r2.mjs wrangler.admin.jsonc wrangler.admin.deploy.jsonc
            echo "STORE_CONFIG=wrangler.deploy.jsonc" >> "$GITHUB_ENV"
            echo "ADMIN_CONFIG=wrangler.admin.deploy.jsonc" >> "$GITHUB_ENV"
          fi

      # Old address records on these names make Cloudflare refuse the custom domains (error 523 for visitors). Remove just those.
      - name: Free the website's domain names
        continue-on-error: true
        run: node scripts/free-domains.mjs nureasmir.com www.nureasmir.com

      - name: Build storefront
        run: npm run cf:build:store

      - name: Deploy storefront
        run: npx wrangler deploy -c "$STORE_CONFIG" --var BUILD_ID:${{ github.sha }}

      # The ISR page cache lives in a Cloudflare R2 bucket (nure-asmir-cache) that persists across
      # deploys, while every build's JS/CSS chunk filenames are freshly content-hashed. Without this, a
      # page cached by the previous build would keep being served after the deploy, referencing chunks
      # that no longer exist. Scoped to "incremental-cache/" in that bucket only – product, category and
      # campaign images live in Neon Object Storage and are never touched.
      - name: Purge stale ISR page cache
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: nure-asmir-cache
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ -n "${R2_ACCESS_KEY_ID:-}" ]; then
            npx tsx scripts/purge-isr-cache.ts
          else
            echo "::warning::R2_* secrets are not set – skipping the ISR cache purge (harmless on a first deploy)."
          fi

      - name: Build admin
        run: npm run cf:build:admin

      - name: Deploy admin
        run: npx wrangler deploy -c "$ADMIN_CONFIG"

      # Runtime secrets the Workers read via process.env. Each value arrives through `env:` and is piped
      # with printf '%s' — never interpolated into the script text — so a secret containing shell syntax
      # cannot alter the command. Pushed on every deploy so a rotated GitHub secret stays in sync.
      - name: Sync Worker secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_INITIAL_PASSWORD: ${{ secrets.ADMIN_INITIAL_PASSWORD }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ALGOLIA_APP_ID: ${{ secrets.ALGOLIA_APP_ID }}
          ALGOLIA_ADMIN_KEY: ${{ secrets.ALGOLIA_ADMIN_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
          RESEND_FROM_NAME: ${{ secrets.RESEND_FROM_NAME }}
          WHATSAPP_DEFAULT_NUMBER: ${{ secrets.WHATSAPP_DEFAULT_NUMBER }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          RESEND_API_KEY_2: ${{ secrets.RESEND_API_KEY_2 }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          EMAIL_REPLY_TO: ${{ secrets.EMAIL_REPLY_TO }}
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
          CSP_NONCE: ${{ secrets.CSP_NONCE }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_TEMPLATE_NAME: ${{ secrets.WHATSAPP_TEMPLATE_NAME }}
          WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${{ secrets.WHATSAPP_WEBHOOK_VERIFY_TOKEN }}
          TCS_USERNAME: ${{ secrets.TCS_USERNAME }}
          TCS_PASSWORD: ${{ secrets.TCS_PASSWORD }}
          TCS_ACCOUNT_NO: ${{ secrets.TCS_ACCOUNT_NO }}
          TCS_COST_CENTER_CODE: ${{ secrets.TCS_COST_CENTER_CODE }}
          TCS_ENV: ${{ secrets.TCS_ENV }}
          TCS_SERVICE_CODE: ${{ secrets.TCS_SERVICE_CODE }}
        run: |
          set -euo pipefail
          # Runs after the deploys: on a brand-new account the Workers only exist once they have been deployed.
          for config in wrangler.jsonc wrangler.admin.jsonc; do
            for name in DATABASE_URL SESSION_SECRET ADMIN_EMAIL ADMIN_INITIAL_PASSWORD AWS_ENDPOINT_URL_S3 AWS_ACCESS_KEY_ID \
              AWS_SECRET_ACCESS_KEY AWS_REGION ALGOLIA_APP_ID ALGOLIA_ADMIN_KEY FIREBASE_SERVICE_ACCOUNT RESEND_API_KEY \
              RESEND_FROM_EMAIL RESEND_FROM_NAME WHATSAPP_DEFAULT_NUMBER CRON_SECRET GROQ_API_KEY GROQ_API_KEY_2 GROQ_API_KEY_3 RESEND_API_KEY_2 BREVO_API_KEY EMAIL_REPLY_TO GEOAPIFY_API_KEY TURNSTILE_SECRET_KEY \
              CSP_NONCE WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_APP_SECRET WHATSAPP_TEMPLATE_NAME \
              WHATSAPP_WEBHOOK_VERIFY_TOKEN TCS_USERNAME TCS_PASSWORD TCS_ACCOUNT_NO TCS_COST_CENTER_CODE TCS_ENV TCS_SERVICE_CODE; do
              value="${!name:-}"
              if [ -n "$value" ]; then
                printf '%s' "$value" | npx wrangler secret put "$name" -c "$config" || echo "::warning::could not set $name on $config"
              fi
            done
          done
