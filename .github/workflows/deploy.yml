name: Deploy to Vercel (legacy, manual only)

# The shop now runs on Cloudflare Workers with a Cloudflare D1 database (.github/workflows/deploy-cloudflare.yml). This Vercel deploy is kept
# only as a manual fallback and no longer runs on a push to main: the code needs a D1 database, which a Vercel deployment does not have, so
# deploying it there would only produce an error page.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Vercel secrets
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v:-}" ]; then echo "::error::$v is not set"; exit 1; fi
          done

      - name: Deploy to Vercel Production
        run: |
          CLEAN_TOKEN=$(node -e 'process.stdout.write((process.env.VERCEL_TOKEN || "").replace(/^\uFEFF/, "").trim())')
          CLEAN_ORG=$(node -e 'process.stdout.write((process.env.VERCEL_ORG_ID || "").replace(/^\uFEFF/, "").trim())')
          CLEAN_PROJECT=$(node -e 'process.stdout.write((process.env.VERCEL_PROJECT_ID || "").replace(/^\uFEFF/, "").trim())')
          VERCEL_TOKEN="$CLEAN_TOKEN" VERCEL_ORG_ID="$CLEAN_ORG" VERCEL_PROJECT_ID="$CLEAN_PROJECT" npx --yes vercel@63.1.2 deploy --prod --yes --token="$CLEAN_TOKEN"
