name: Deploy to Production (Vercel)

# Applies database migrations and deploys the entire Next.js application to Vercel on push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify Vercel secrets
        run: |
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v:-}" ]; then echo "::error::$v is not set"; exit 1; fi
          done

      - name: Apply database migrations
        run: npx drizzle-kit migrate

      # The PRACTICE tables (a separate schema in the same database): kept up to date with the
      # same migrations. Only runs once the PRACTICE_DATABASE_URL secret exists.
      - name: Practice tables (only when PRACTICE_DATABASE_URL is set)
        env:
          PRACTICE_DATABASE_URL: ${{ secrets.PRACTICE_DATABASE_URL }}
          AWS_ENDPOINT_URL_S3: ${{ secrets.AWS_ENDPOINT_URL_S3 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail
          if [ -z "${PRACTICE_DATABASE_URL:-}" ]; then
            echo "No PRACTICE_DATABASE_URL secret – skipping the practice tables."
            exit 0
          fi
          DATABASE_URL="$PRACTICE_DATABASE_URL" npx tsx scripts/practice-migrate.ts
          DATABASE_URL="$PRACTICE_DATABASE_URL" ADMIN_EMAIL=practice@nureasmir.com ADMIN_INITIAL_PASSWORD="$(openssl rand -hex 16)" npx tsx scripts/sandbox-setup.ts

      - name: Deploy to Vercel Production
        run: npx --yes vercel@63.1.2 deploy --prod --yes
